---
layout: default
---
<header class="masthead">
  <h1 class="masthead-title">
    <a href="{{ site.baseurl }}/">{{ site.name }}</a>
  </h1>
  <nav class="masthead-nav">
    {% for nav in site.nav %}
    <a href="{{ nav.href }}">{{ nav.name }}</a>
    {% endfor %}
  </nav>
  <p>
    Hi there. I'm a graduate student @ <a href="{{ rombokas }}">Rombolabs</a>, <a href="https://uw.edu" style="color:#4b2e8;">University of washington</a>
    <br>
    I have interests in robotics, game dev and machining.
  </p>
</header>
